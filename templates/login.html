<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · DIMinfra</title>
  <link rel="icon" href="{{ url_for('data_logos', filename='DIMinfr@.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --brand: #1d4ed8;
      --brand-dark: #1e3a8a;
      --accent: #38bdf8;
      --bg-1: #0f172a;
      --bg-2: #1e3a8a;
      --bg-3: #0ea5e9;
      --card: rgba(255,255,255,0.96);
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --error-bg: #fef2f2;
      --error-fg: #b91c1c;
      --error-border: #fecaca;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      background-size: 200% 200%;
      animation: bgShift 18s ease infinite;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }
    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* Decorative blurred orbs */
    body::before, body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 380px; height: 380px;
      background: #38bdf8;
      top: -120px; left: -120px;
    }
    body::after {
      width: 460px; height: 460px;
      background: #6366f1;
      bottom: -160px; right: -140px;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--card);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow:
        0 20px 60px rgba(2, 6, 23, 0.45),
        0 2px 6px rgba(2, 6, 23, 0.15);
      padding: 2.4rem 2.4rem 2rem;
      animation: rise 0.6s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.6rem;
    }
    .brand img {
      width: 110px;
      height: auto;
      filter: drop-shadow(0 6px 14px rgba(29, 78, 216, 0.35));
    }
    .brand .tagline {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0 0 0.3rem;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      letter-spacing: -0.02em;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 1.6rem;
    }

    .field {
      position: relative;
      margin-bottom: 1.05rem;
    }
    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.35rem;
      letter-spacing: 0.02em;
    }
    .field input {
      width: 100%;
      padding: 0.78rem 1rem 0.78rem 2.6rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font: inherit;
      font-size: 1rem;
      background: #f8fafc;
      color: var(--text);
      transition: border-color .2s, background .2s, box-shadow .2s;
    }
    .field input:hover { background: #fff; }
    .field input:focus {
      outline: none;
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.12);
    }
    .field .icon {
      position: absolute;
      left: 0.95rem;
      top: 2.05rem;
      width: 18px;
      height: 18px;
      color: #94a3b8;
      pointer-events: none;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0.4rem 0 1.2rem;
      font-size: 0.88rem;
    }
    .row label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .row input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--brand);
    }

    .btn {
      width: 100%;
      padding: 0.85rem 1rem;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(29, 78, 216, 0.35);
      transition: transform .12s ease, box-shadow .2s ease, filter .2s ease;
    }
    .btn:hover { filter: brightness(1.08); box-shadow: 0 10px 24px rgba(29, 78, 216, 0.45); }
    .btn:active { transform: translateY(1px); }

    .error {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--error-bg);
      color: var(--error-fg);
      border: 1px solid var(--error-border);
      border-radius: 10px;
      padding: 0.6rem 0.85rem;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .error svg { flex: none; width: 18px; height: 18px; }

    .footer {
      margin-top: 1.6rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
    }
    .footer strong { color: #334155; }

    @media (max-width: 480px) {
      .card { padding: 1.8rem 1.4rem 1.5rem; border-radius: 16px; }
      .brand img { width: 92px; }
      h1 { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="brand">
      <img src="{{ url_for('data_logos', filename='DIMinfr@.png') }}" alt="DIMinfra logo">
      <span class="tagline">Digitale Leveringsbon</span>
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to DIMinfra</p>

    {% if error %}
      <div class="error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form method="post" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus placeholder="your username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>

      <div class="row">
        <label><input type="checkbox" name="remember"> Remember me</label>
      </div>

      <button type="submit" class="btn">Sign in</button>
    </form>

    <div class="footer">
      &copy; <span id="year"></span> <strong>DIMinfra</strong> · All rights reserved
    </div>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
